name: Rebuild Anastasia default portrait

on:
  push:
    branches:
      - codex/anastasia-default-final-20260823
    paths:
      - tmp/anastasia-default-final/READY

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: codex/anastasia-default-final-20260823
          fetch-depth: 0

      - name: Rebuild and verify WEBP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/characters-v2/anastasia/portrait
          cat tmp/anastasia-default-final/part*.b64 \
            | tr -d '\n\r' \
            | base64 -d \
            > assets/characters-v2/anastasia/portrait/default.webp

          test "$(stat -c%s assets/characters-v2/anastasia/portrait/default.webp)" -eq 57606
          echo "1a2b991682690e6c73855333d2592c391a30bfc452469e1bfd2be65609c266ad  assets/characters-v2/anastasia/portrait/default.webp" | sha256sum -c -
          file assets/characters-v2/anastasia/portrait/default.webp | grep -qi 'Web/P image'

      - name: Update asset manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('assets/characterImagesV2.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if 'anastasia' not in data:
              raise SystemExit('anastasia entry missing from asset manifest')
          data['anastasia']['default'] = '/assets/characters-v2/anastasia/portrait/default.webp'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          rm -rf tmp/anastasia-default-final

      - name: Commit rebuilt asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/characters-v2/anastasia/portrait/default.webp assets/characterImagesV2.json tmp/anastasia-default-final
          git diff --cached --check
          git commit -m 'assets: add Anastasia default portrait'
          git push origin HEAD:codex/anastasia-default-final-20260823
