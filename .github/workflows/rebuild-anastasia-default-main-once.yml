name: Rebuild Anastasia default portrait once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rebuild-anastasia-default-main-once.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch staged chunks
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/anastasia-default-final-20260823:refs/remotes/origin/codex/anastasia-default-final-20260823

      - name: Rebuild and verify WEBP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/characters-v2/anastasia/portrait
          for part in part00.b64 part01.b64 part02.b64 part03.b64 part04.b64 part05.b64; do
            git show "refs/remotes/origin/codex/anastasia-default-final-20260823:tmp/anastasia-default-final/${part}"
          done | tr -d '\n\r' | base64 -d > assets/characters-v2/anastasia/portrait/default.webp

          test "$(stat -c%s assets/characters-v2/anastasia/portrait/default.webp)" -eq 57606
          echo "1a2b991682690e6c73855333d2592c391a30bfc452469e1bfd2be65609c266ad  assets/characters-v2/anastasia/portrait/default.webp" | sha256sum -c -
          file assets/characters-v2/anastasia/portrait/default.webp | grep -qi 'Web/P image'

      - name: Update Anastasia manifest entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('assets/characterImagesV2.json')
          text = path.read_text(encoding='utf-8')
          old = '"anastasia": {\n    "default": null,'
          new = '"anastasia": {\n    "default": "/assets/characters-v2/anastasia/portrait/default.webp",'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one Anastasia null-default entry, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit final asset and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/rebuild-anastasia-default-main-once.yml
          git add assets/characters-v2/anastasia/portrait/default.webp assets/characterImagesV2.json
          git diff --cached --check
          git commit -m 'assets: add Anastasia default portrait'
          git push origin HEAD:main
