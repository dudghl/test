name: Rebuild Anastasia default portrait once

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tmp/anastasia-q75/**'
      - 'assets/characterImagesV2.json'

permissions:
  contents: write

jobs:
  rebuild:
    if: github.head_ref == 'codex/anastasia-default-final-20260823'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Rebuild and verify WEBP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/characters-v2/anastasia/portrait
          cat tmp/anastasia-q75/part*.b64 | tr -d '\n\r' | base64 -d > assets/characters-v2/anastasia/portrait/default.webp
          test "$(stat -c%s assets/characters-v2/anastasia/portrait/default.webp)" -eq 39164
          echo "b277ff92b3665264d45a36f74d933f7965137d7485a34d3933f48f7a44fcb505  assets/characters-v2/anastasia/portrait/default.webp" | sha256sum -c -
          file assets/characters-v2/anastasia/portrait/default.webp | grep -qi 'Web/P image'

      - name: Update Anastasia manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('assets/characterImagesV2.json')
          text = path.read_text(encoding='utf-8')
          old = '"anastasia": {\n    "default": null,'
          new = '"anastasia": {\n    "default": "/assets/characters-v2/anastasia/portrait/default.webp",'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Anastasia manifest entry not recognized')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp/anastasia-q75 tmp/anastasia-default-final tmp/anastasia-default-exact tmp/anastasia-default-20260823
          rm -f .github/workflows/rebuild-anastasia-default.yml

      - name: Commit rebuilt asset to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/characters-v2/anastasia/portrait/default.webp assets/characterImagesV2.json tmp .github/workflows/rebuild-anastasia-default.yml || true
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'assets: add Anastasia default portrait'
          git push origin HEAD:${{ github.head_ref }}
