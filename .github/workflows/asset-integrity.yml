name: Lumensia Asset Integrity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check asset integrity
        env:
          ASSET_INTEGRITY_DIFF_BASE: HEAD^
        run: node scripts/asset-integrity-check.mjs
      - name: Check whitespace
        run: git diff --check
